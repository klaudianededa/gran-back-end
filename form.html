<!DOCTYPE html>
<html lang="en">

<head>
    <title>ViaCEP WebService</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta httt-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script>
        function limpa_formulario_cep() {
            document.getElementById('rua').value = "";
            document.getElementById('bairro').value = "";
            document.getElementById('cidade').value = "";
            document.getElementById('uf').value = "";
            document.getElementById('ibge').value = "";
        }
        function meu_callback(conteudo) {
            if (!("erro" in conteudo)) {
                document.getElementById('rua').value = conteudo.logradouro;
                document.getElementById('bairro').value = conteudo.bairro;
                document.getElementById('cidade').value = conteudo.localidade;
                document.getElementById('uf').value = conteudo.uf;
                document.getElementById('ibge').value = conteudo.ibge;
            }
            else {
                limpa_formulario_cep();
                alert("CEP não encontrado");
            }
        }
        function pesquisacep(valor) {
            var cep = valor.replace(/\D/g, '');
            if (cep != "") {
                var validacep = /^[0-9]{8}$/;
                if (validacep.test(cep)) {
                    document.getElementById('rua').value = "...";
                    document.getElementById('bairro').value = "...";
                    document.getElementById('cidade').value = "...";
                    document.getElementById('uf').value = "...";
                    document.getElementById('ibge').value = "...";
                    var script = document.createElement('script');
                    script.src =
                        'https://viacep.com.br/ws/' +
                        cep + '/json/?callback=meu_callback';
                    document.body.appendChild(script);
                } else {
                    limpa_formulario_cep();
                    alert("formato ed CEP inválido");
                }
            } else {
                limpa_formulario_cep();
            }
        }
    </script>
</head>

<body>
    <div class="container-fluid">
        <form method="get" action=".">
            <div class="panel panel-primary">
                <div class="panel-heading">
                    <h3 class="panel-title">
                        achador de ceps S2S2
                    </h3>
                </div>
                <div class="panel-body">
                    <div class="row">
                        <div class="col-sm-3">
                            <div class="form-group">
                                <label for="cep">CEP</label>
                                <input name="cep" type="text" id="cep" class="form-control" maxlength="9"
                                    onblur="pesquisacep(this.value);">
                            </div>
                        </div>
                        <div class="col-sm-7">
                            <div class="form-group">
                                <label for="rua">Rua</label>
                                <input name="rua" type="text" id="rua" class="form-control">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <label for="uf">Estado</label>
                                <input name="uf" type="text" id="uf" class="form-control">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-5">
                            <div class="form-group">
                                <label for="bairro">Bairro</label>
                                <input name="bairro" type="text" id="bairro" class="form-control">
                            </div>
                        </div>
                        <div class="col-sm-7">
                            <div class="form-group">
                                <label for="cidade">Cidade</label>
                                <input name="cidade" type="text" id="cidade" class="form-control">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-12">
                            <div class="form-group">
                                <label for="ibge">
                                    IBGE:</label>
                                <input name="ibge" type="text" id="ibge" class="form-control" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
